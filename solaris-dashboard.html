<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solaris - Animated Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #0a0e1a 0%, #0f1629 50%, #0a0e1a 100%);
  color: #eef1f8;
  font-family: 'Arial', sans-serif;
  overflow: hidden;
  height: 100vh;
}

.container {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 40px;
}

/* Globe Animation */
.globe-section {
  position: absolute;
  left: 5%;
  width: 40%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.globe {
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(79, 137, 240, 0.2), rgba(45, 212, 191, 0.1), rgba(10, 14, 26, 0.8));
  position: relative;
  box-shadow: 0 0 60px rgba(79, 137, 240, 0.3), inset 0 0 60px rgba(79, 137, 240, 0.1);
  animation: globeRotate 20s linear infinite;
}

@keyframes globeRotate {
  0% { transform: rotateY(0deg) rotateX(15deg); }
  100% { transform: rotateY(360deg) rotateX(15deg); }
}

.globe::before {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 2px solid rgba(79, 137, 240, 0.3);
  box-shadow: 0 0 20px rgba(79, 137, 240, 0.2);
  animation: globePulse 3s ease-in-out infinite;
}

@keyframes globePulse {
  0%, 100% { box-shadow: 0 0 20px rgba(79, 137, 240, 0.2); }
  50% { box-shadow: 0 0 40px rgba(79, 137, 240, 0.4); }
}

.globe-glow {
  position: absolute;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  box-shadow: 0 0 80px rgba(79, 137, 240, 0.2), 0 0 120px rgba(45, 212, 191, 0.1);
  animation: glowPulse 4s ease-in-out infinite;
}

@keyframes glowPulse {
  0%, 100% { box-shadow: 0 0 80px rgba(79, 137, 240, 0.2), 0 0 120px rgba(45, 212, 191, 0.1); }
  50% { box-shadow: 0 0 100px rgba(79, 137, 240, 0.4), 0 0 150px rgba(45, 212, 191, 0.2); }
}

/* Center Content */
.center-content {
  text-align: center;
  position: relative;
  z-index: 10;
  animation: fadeInCenter 1s ease-out;
}

@keyframes fadeInCenter {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin-bottom: 20px;
}

.logo-bars {
  display: flex;
  gap: 4px;
  height: 32px;
}

.bar {
  width: 6px;
  border-radius: 3px;
  animation: barPulse 2s ease-in-out infinite;
}

.bar:nth-child(1) { background: #5b93f5; animation-delay: 0s; }
.bar:nth-child(2) { background: #2dd4bf; animation-delay: 0.2s; }
.bar:nth-child(3) { background: #fb923c; animation-delay: 0.4s; }
.bar:nth-child(4) { background: #f1685a; animation-delay: 0.6s; }

@keyframes barPulse {
  0%, 100% { height: 32px; opacity: 0.6; }
  50% { height: 48px; opacity: 1; }
}

.solaris-title {
  font-size: 3.5em;
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #82b1ff 0%, #2dd4bf 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: 0 0 30px rgba(79, 137, 240, 0.3);
  animation: titleGlow 3s ease-in-out infinite;
}

@keyframes titleGlow {
  0%, 100% { text-shadow: 0 0 30px rgba(79, 137, 240, 0.3); }
  50% { text-shadow: 0 0 60px rgba(79, 137, 240, 0.6), 0 0 40px rgba(45, 212, 191, 0.3); }
}

.tagline {
  font-size: 1.1em;
  color: #a9b3c7;
  letter-spacing: 3px;
  margin-bottom: 40px;
  animation: fadeInUp 1.2s ease-out;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Features Grid */
.features {
  display: flex;
  gap: 30px;
  justify-content: center;
  margin-bottom: 40px;
  animation: fadeInUp 1.4s ease-out;
}

.feature {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.feature-icon {
  width: 50px;
  height: 50px;
  border: 2px solid rgba(79, 137, 240, 0.4);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  background: rgba(79, 137, 240, 0.05);
  box-shadow: 0 0 20px rgba(79, 137, 240, 0.1);
  transition: all 0.3s ease;
}

.feature:hover .feature-icon {
  border-color: #4f89f0;
  box-shadow: 0 0 30px rgba(79, 137, 240, 0.3);
  background: rgba(79, 137, 240, 0.15);
  transform: translateY(-5px);
}

.feature-label {
  font-size: 0.8em;
  color: #a9b3c7;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* Right Panel */
.right-panel {
  position: absolute;
  right: 5%;
  width: 35%;
  height: 80%;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.data-panel {
  background: rgba(18, 26, 44, 0.6);
  border: 1px solid rgba(79, 137, 240, 0.2);
  border-radius: 12px;
  padding: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  transition: all 0.3s ease;
  animation: slideInRight 1s ease-out;
}

.data-panel:hover {
  border-color: rgba(79, 137, 240, 0.5);
  box-shadow: 0 8px 32px rgba(79, 137, 240, 0.15);
  transform: translateY(-5px);
}

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(50px); }
  to { opacity: 1; transform: translateX(0); }
}

.panel-title {
  font-size: 0.9em;
  color: #a9b3c7;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 15px;
}

.heatmap {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.heatmap-cell {
  aspect-ratio: 1;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #0a0e1a;
  font-weight: bold;
  font-size: 0.85em;
  background: linear-gradient(135deg, #4ade80 0%, #3ecf6f 100%);
  box-shadow: 0 0 15px rgba(78, 222, 128, 0.3);
  animation: heatmapPulse 2s ease-in-out infinite;
}

.heatmap-cell:nth-child(1) { animation-delay: 0s; background: linear-gradient(135deg, #4ade80 0%, #3ecf6f 100%); }
.heatmap-cell:nth-child(2) { animation-delay: 0.2s; background: linear-gradient(135deg, #4ade80 0%, #3ecf6f 100%); }
.heatmap-cell:nth-child(3) { animation-delay: 0.4s; background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%); box-shadow: 0 0 15px rgba(244, 114, 182, 0.3); }
.heatmap-cell:nth-child(4) { animation-delay: 0.6s; background: linear-gradient(135deg, #4ade80 0%, #3ecf6f 100%); }
.heatmap-cell:nth-child(5) { animation-delay: 0.8s; background: linear-gradient(135deg, #fb923c 0%, #f97316 100%); box-shadow: 0 0 15px rgba(251, 146, 60, 0.3); }
.heatmap-cell:nth-child(6) { animation-delay: 1s; background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); box-shadow: 0 0 15px rgba(220, 38, 38, 0.3); }

@keyframes heatmapPulse {
  0% {
    transform: scale(1);
    box-shadow: 0 0 10px rgba(78, 222, 128, 0.2);
    filter: brightness(0.95);
  }
  50% {
    transform: scale(1.08);
    box-shadow: 0 0 30px rgba(78, 222, 128, 0.6), inset 0 0 15px rgba(78, 222, 128, 0.2);
    filter: brightness(1.2);
  }
  100% {
    transform: scale(1);
    box-shadow: 0 0 10px rgba(78, 222, 128, 0.2);
    filter: brightness(0.95);
  }
}

.score-display {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin: 10px 0;
}

.score-circle {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: conic-gradient(#4ade80 0deg, #4ade80 270deg, rgba(74, 222, 128, 0.2) 270deg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5em;
  font-weight: bold;
  color: #4ade80;
  box-shadow: 0 0 30px rgba(74, 222, 128, 0.3);
  animation: scoreRotate 4s linear infinite;
}

@keyframes scoreRotate {
  0%, 100% { box-shadow: 0 0 30px rgba(74, 222, 128, 0.3); }
  50% { box-shadow: 0 0 50px rgba(74, 222, 128, 0.5); }
}

.chart-bars {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 60px;
  margin-top: 10px;
}

.chart-bar {
  flex: 1;
  background: linear-gradient(180deg, #4f89f0 0%, #2563eb 100%);
  border-radius: 4px 4px 0 0;
  box-shadow: 0 0 10px rgba(79, 137, 240, 0.2);
  animation: barWave 3s ease-in-out infinite;
}

.chart-bar:nth-child(1) { animation-delay: 0s; height: 40%; }
.chart-bar:nth-child(2) { animation-delay: 0.3s; height: 60%; }
.chart-bar:nth-child(3) { animation-delay: 0.6s; height: 45%; }
.chart-bar:nth-child(4) { animation-delay: 0.9s; height: 75%; }
.chart-bar:nth-child(5) { animation-delay: 1.2s; height: 55%; }

@keyframes barWave {
  0% {
    box-shadow: 0 0 10px rgba(79, 137, 240, 0.2), inset 0 0 10px rgba(79, 137, 240, 0.1);
    filter: brightness(0.9);
  }
  50% {
    box-shadow: 0 0 30px rgba(79, 137, 240, 0.6), inset 0 0 20px rgba(79, 137, 240, 0.3);
    filter: brightness(1.3);
    transform: scaleY(1.1);
  }
  100% {
    box-shadow: 0 0 10px rgba(79, 137, 240, 0.2), inset 0 0 10px rgba(79, 137, 240, 0.1);
    filter: brightness(0.9);
  }
}

.checkmark {
  font-size: 1.2em;
  color: #4ade80;
  animation: checkPulse 2s ease-in-out infinite;
}

@keyframes checkPulse {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.2); }
}
</style>
</head>
<body>

<div class="container">
  <div class="globe-section">
    <div class="globe-glow"></div>
    <div class="globe"></div>
  </div>

  <div class="center-content">
    <div class="logo">
      <div class="logo-bars">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <div class="solaris-title">SOLARIS</div>
    </div>

    <div class="tagline">SEE THE FLOW. TRADE WITH EDGE.</div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">📊</div>
        <div class="feature-label">13F Flow</div>
      </div>
      <div class="feature">
        <div class="feature-icon">📈</div>
        <div class="feature-label">Daily Tape</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🔗</div>
        <div class="feature-label">Structure</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🎯</div>
        <div class="feature-label">Scoring</div>
      </div>
      <div class="feature">
        <div class="feature-icon">✓</div>
        <div class="feature-label">Validation</div>
      </div>
    </div>
  </div>

  <div class="right-panel">
    <div class="data-panel">
      <div class="panel-title">Flow Heatmap</div>
      <div class="heatmap">
        <div class="heatmap-cell">28.4%</div>
        <div class="heatmap-cell">18.7%</div>
        <div class="heatmap-cell">12.3%</div>
        <div class="heatmap-cell">10.1%</div>
        <div class="heatmap-cell">8.7%</div>
        <div class="heatmap-cell">5.6%</div>
      </div>
    </div>

    <div class="data-panel">
      <div class="panel-title">Market Strength</div>
      <div class="score-display">
        <div class="score-circle">62</div>
        <div>Bullish Signal</div>
      </div>
    </div>

    <div class="data-panel">
      <div class="panel-title">Tape Analytics</div>
      <div class="chart-bars">
        <div class="chart-bar"></div>
        <div class="chart-bar"></div>
        <div class="chart-bar"></div>
        <div class="chart-bar"></div>
        <div class="chart-bar"></div>
      </div>
    </div>

    <div class="data-panel">
      <div class="panel-title">Setup Validation</div>
      <div style="display: flex; gap: 15px; align-items: center;">
        <div style="font-size: 2.5em; font-weight: bold; color: #4ade80;">87</div>
        <div>
          <div class="checkmark">✓ Confluence Aligned</div>
          <div class="checkmark" style="margin-top: 5px;">✓ Risk Setup Valid</div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
