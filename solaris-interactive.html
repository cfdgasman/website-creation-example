<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solaris - Interactive Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0e1a;
  color: #eef1f8;
  font-family: 'Arial', sans-serif;
  overflow: hidden;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.dashboard-container {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.dashboard-image {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  opacity: 0.95;
}

/* Animated Overlay Elements */
.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* Glowing Orbs that follow bars */
.glow-bar {
  position: absolute;
  bottom: 20%;
  width: 40px;
  height: 60px;
  border-radius: 4px;
  opacity: 0;
  animation: barGlowWave 4s ease-in-out infinite;
}

.glow-bar:nth-child(1) {
  left: 18%;
  animation-delay: 0s;
  box-shadow: 0 0 20px rgba(79, 137, 240, 0.6), inset 0 0 10px rgba(79, 137, 240, 0.3);
}

.glow-bar:nth-child(2) {
  left: 32%;
  animation-delay: 0.3s;
  box-shadow: 0 0 20px rgba(79, 137, 240, 0.6), inset 0 0 10px rgba(79, 137, 240, 0.3);
}

.glow-bar:nth-child(3) {
  left: 46%;
  animation-delay: 0.6s;
  box-shadow: 0 0 20px rgba(79, 137, 240, 0.6), inset 0 0 10px rgba(79, 137, 240, 0.3);
}

.glow-bar:nth-child(4) {
  left: 60%;
  animation-delay: 0.9s;
  box-shadow: 0 0 20px rgba(79, 137, 240, 0.6), inset 0 0 10px rgba(79, 137, 240, 0.3);
}

.glow-bar:nth-child(5) {
  left: 74%;
  animation-delay: 1.2s;
  box-shadow: 0 0 20px rgba(79, 137, 240, 0.6), inset 0 0 10px rgba(79, 137, 240, 0.3);
}

@keyframes barGlowWave {
  0% {
    opacity: 0;
    box-shadow: 0 0 10px rgba(79, 137, 240, 0.2), inset 0 0 5px rgba(79, 137, 240, 0.1);
  }
  40% {
    opacity: 0;
  }
  50% {
    opacity: 1;
    box-shadow: 0 0 40px rgba(79, 137, 240, 0.9), inset 0 0 20px rgba(79, 137, 240, 0.4), 0 0 60px rgba(79, 137, 240, 0.5);
  }
  60% {
    opacity: 0;
  }
  100% {
    opacity: 0;
  }
}

/* Pulsing glow circles for heatmap areas */
.glow-circle {
  position: absolute;
  border-radius: 50%;
  opacity: 0;
  animation: circlePulse 3s ease-in-out infinite;
}

.glow-circle:nth-child(6) {
  width: 80px;
  height: 80px;
  right: 22%;
  top: 20%;
  animation-delay: 0s;
  background: radial-gradient(circle, rgba(74, 222, 128, 0.4), transparent);
  box-shadow: 0 0 30px rgba(74, 222, 128, 0.5);
}

.glow-circle:nth-child(7) {
  width: 100px;
  height: 100px;
  right: 10%;
  top: 45%;
  animation-delay: 0.5s;
  background: radial-gradient(circle, rgba(79, 137, 240, 0.3), transparent);
  box-shadow: 0 0 40px rgba(79, 137, 240, 0.4);
}

.glow-circle:nth-child(8) {
  width: 90px;
  height: 90px;
  right: 15%;
  bottom: 25%;
  animation-delay: 1s;
  background: radial-gradient(circle, rgba(244, 114, 182, 0.3), transparent);
  box-shadow: 0 0 35px rgba(244, 114, 182, 0.4);
}

@keyframes circlePulse {
  0% {
    opacity: 0;
    transform: scale(0.8);
  }
  30% {
    opacity: 1;
    transform: scale(1);
  }
  70% {
    opacity: 1;
    transform: scale(1);
  }
  100% {
    opacity: 0;
    transform: scale(1.3);
  }
}

/* Scan line effect across the dashboard */
.scan-line {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(79, 137, 240, 0.6), transparent);
  animation: scanMove 4s linear infinite;
}

@keyframes scanMove {
  0% {
    top: 0;
  }
  100% {
    top: 100%;
  }
}

/* Glow text for key metrics */
.metric-glow {
  position: absolute;
  font-size: 2em;
  font-weight: bold;
  text-shadow: 0 0 20px rgba(79, 137, 240, 0.6);
  animation: metricGlow 2s ease-in-out infinite;
}

.metric-glow:nth-child(9) {
  right: 18%;
  top: 38%;
  color: #4ade80;
  animation-delay: 0s;
}

.metric-glow:nth-child(10) {
  right: 18%;
  bottom: 32%;
  color: #4ade80;
  animation-delay: 0.5s;
}

@keyframes metricGlow {
  0%, 100% {
    text-shadow: 0 0 10px rgba(79, 137, 240, 0.3);
    opacity: 0.7;
  }
  50% {
    text-shadow: 0 0 30px rgba(74, 222, 128, 0.8), 0 0 50px rgba(74, 222, 128, 0.4);
    opacity: 1;
  }
}
</style>
</head>
<body>

<div class="dashboard-container">
  <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1920 1080' width='1920' height='1080'%3E%3Crect fill='%230a0e1a' width='1920' height='1080'/%3E%3Ctext x='960' y='540' font-size='48' fill='%234f89f0' text-anchor='middle' dy='.3em'%3EYour Solaris Dashboard Image Here%3C/text%3E%3C/svg%3E" alt="Solaris Dashboard" class="dashboard-image">

  <div class="overlay">
    <!-- Animated glowing bars -->
    <div class="glow-bar"></div>
    <div class="glow-bar"></div>
    <div class="glow-bar"></div>
    <div class="glow-bar"></div>
    <div class="glow-bar"></div>

    <!-- Pulsing glow circles for heatmaps -->
    <div class="glow-circle"></div>
    <div class="glow-circle"></div>
    <div class="glow-circle"></div>

    <!-- Metric glows -->
    <div class="metric-glow">62</div>
    <div class="metric-glow">87</div>

    <!-- Scan line -->
    <div class="scan-line"></div>
  </div>
</div>

</body>
</html>
